<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mango | Asistente IA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7c5cff">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme">
    <style>
        /* Estilos rápidos para el login */
        #login-overlay {
            position: fixed; inset: 0; background: rgba(11, 11, 26, 0.9);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; backdrop-filter: blur(10px);
        }
        .login-box {
            background: var(--glass-bg-strong); padding: 30px; border-radius: 20px;
            border: 1px solid var(--glass-border); text-align: center;
            box-shadow: var(--shadow); width: 300px;
        }
        .login-box input {
            width: 100%; padding: 12px; margin: 15px 0; border-radius: 10px;
            border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3);
            color: white; text-align: center; font-size: 1rem;
        }
        .login-box button {
            width: 100%; padding: 12px; border-radius: 10px; border: none;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: white; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Pantalla de Login -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>Acceso Restringido</h2>
            <p style="color: var(--text-dim); font-size: 0.9rem;">Ingresa tu llave maestra para usar a Mango.</p>
            <input type="password" id="master-key-input" placeholder="Llave Maestra...">
            <button onclick="saveKey()">Entrar</button>
        </div>
    </div>

    <div class="app-wrapper">
        <header class="app-header">
            <div class="logo-area">
                <div class="avatar">AI</div>
                <h1>Mango</h1>
            </div>
            
            <div class="header-controls">
                <button id="theme-toggle" class="icon-btn" title="Cambiar tema">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>

                <button id="tts-toggle" class="icon-btn" title="Activar lectura en voz alta">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    </svg>
                </button>

                <select id="model-selector" class="model-selector">
                    <option value="groq">Groq (Rápido)</option>
                    <option value="gemini">Gemini (Google)</option>
                </select>

                <button id="new-chat-btn" class="new-chat-btn" title="Nueva conversación">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Nueva
                </button>

                <div class="status-indicator" id="status-indicator">
                    <span class="dot"></span> Conectado
                </div>
            </div>
        </header>

        <main class="chat-container" id="chat-container">
        </main>

        <footer class="input-area">
            <form id="chat-form" class="input-form">
                <button type="button" id="upload-btn" class="icon-btn" title="Subir archivo">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                    </svg>
                </button>
                <input type="file" id="file-input" style="display: none;">

                <button type="button" id="mic-btn" class="icon-btn" title="Hablar">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </button>

                <textarea id="chat-input" placeholder="Escribe un mensaje aquí..." rows="1" autocomplete="off" required></textarea>
                <button type="submit" id="send-btn" aria-label="Enviar mensaje">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
            <div class="input-footer">
                <span>Presiona Enter para enviar, Shift+Enter para salto de línea.</span>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
