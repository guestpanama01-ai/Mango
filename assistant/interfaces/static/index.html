<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente IA Personal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <header class="app-header">
            <div class="logo-area">
                <div class="avatar">AI</div>
                <h1>Asistente Personal</h1>
            </div>
            
            <div class="header-controls">
                <!-- Selector de modelo -->
                <select id="model-selector" class="model-selector">
                    <option value="groq">Groq (Rápido)</option>
                    <option value="claude">Claude (Inteligente)</option>
                    <option value="gemini">Gemini (Google)</option>
                </select>

                <!-- Botón de nueva conversación -->
                <button id="new-chat-btn" class="new-chat-btn" title="Nueva conversación">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Nueva
                </button>

                <div class="status-indicator" id="status-indicator">
                    <span class="dot"></span> Conectado
                </div>
            </div>
        </header>

        <main class="chat-container" id="chat-container">
            <!-- Los mensajes se cargan dinámicamente desde app.js -->
        </main>

        <footer class="input-area">
            <form id="chat-form" class="input-form">
                <textarea id="chat-input" placeholder="Escribe un mensaje aquí..." rows="1" autocomplete="off" required></textarea>
                <button type="submit" id="send-btn" aria-label="Enviar mensaje">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
            <div class="input-footer">
                <span>Presiona Enter para enviar, Shift+Enter para salto de línea.</span>
            </div>
        </footer>
    </div>
    
    <!-- Cargamos app.js -->
    <script src="app.js"></script>
</body>
</html>
